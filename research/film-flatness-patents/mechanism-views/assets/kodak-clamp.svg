<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 282" role="img" aria-labelledby="title description">
  <title id="title">7B · Kodak film clamping and tension</title>
  <desc id="description">The tie bar presses the lower belt run on the film at the datum side. The cylinder then bears down and outward. The spring arm bends under the crank finger.</desc>
  <style>
    text { font: 20px system-ui, sans-serif; fill: #1c2c26; }
    .body { fill: #d9e0de; stroke: #50645e; stroke-width: 2; }
    .moving { fill: #f4c57d; stroke: #70471e; stroke-width: 2; }
    .belt { fill: #3f4e58; }
    .arm { fill: none; stroke: #70471e; stroke-width: 4; stroke-linecap: round; }
    .leader { fill: none; stroke: #52625a; stroke-width: 1.5; }
    .motion { fill: none; stroke: #2456a0; stroke-width: 2.5; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#2456a0"/>
    </marker>
  </defs>
  <rect width="620" height="282" fill="#f8f8f4"/>
