    <text x="361" y="175" text-anchor="middle">aperture</text>
    <path d="M508 76l-21 20m22 143l-21-18m-263 21l55-33" fill="none" stroke="#617587"/>
    <text x="514" y="79">Edge belt</text>
    <text x="514" y="248">Edge belt</text>
    <text x="120" y="251">Single frame</text>
