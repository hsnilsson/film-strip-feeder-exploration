    <marker id="feed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0l8 4-8 4z" fill="#00756e"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="718" height="273" rx="12" fill="#f7fafc" stroke="#bccbd7"/>
  <g font-family="Arial, sans-serif" fill="#182c3e" font-size="16">
    <text x="25" y="32" font-weight="700" font-size="20">Continuous edge-belt transport</text>
    <text x="25" y="55">Proposed concept · top view</text>
    <g fill="#dce5ee" stroke="#40566b" stroke-width="2">
      <rect x="74" y="96" width="574" height="22" rx="11"/>
      <rect x="74" y="199" width="574" height="22" rx="11"/>
    </g>
    <rect x="280" y="105" width="162" height="107" rx="3" fill="#a0ddd3" fill-opacity=".6" stroke="#00756e" stroke-width="2"/>
    <rect x="292" y="126" width="138" height="65" rx="3" fill="#f7fafc" stroke="#617587" stroke-width="2" stroke-dasharray="5 4"/>
    <path d="M302 112h120m-120 93h120" stroke="#40566b" stroke-width="6" stroke-dasharray="7 6"/>
    <g fill="none" stroke="#00756e" stroke-width="2.5" marker-end="url(#feed)">
      <path d="M116 158h113"/>
      <path d="M485 158h113"/>
    </g>
