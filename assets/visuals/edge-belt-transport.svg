<svg xmlns="http://www.w3.org/2000/svg" width="720" height="275" viewBox="0 0 720 275" role="img" aria-labelledby="title desc">
  <title id="title">Continuous edge-belt transport</title>
  <desc id="desc">Top view of a single frame spanning the left and right edge belts. The belts extend through the gate in the film travel direction, with the aperture between them.</desc>
