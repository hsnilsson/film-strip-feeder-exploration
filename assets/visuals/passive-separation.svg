<svg xmlns="http://www.w3.org/2000/svg" width="720" height="270" viewBox="0 0 720 270" role="img" aria-labelledby="title desc">
  <title id="title">Passive separation hypothesis</title>
  <desc id="desc">Conceptual side view. The stack and felt-like support form a shallow U. The support joins the top of the retaining edge, and the stacked strips meet the rising support in order from bottom to top. The support may press the stack into the upper roller as it advances the top strip.</desc>
